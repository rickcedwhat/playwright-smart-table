name: Documentation Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-check.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'scripts/docs-build-prod.mjs'
      - 'scripts/verify-vitepress-links.mjs'
      - 'scripts/generate-all-api-docs.mjs'
      - 'scripts/update-all-api-signatures.mjs'

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify API signatures match src/types.ts
        run: |
          pnpm run generate-all-api-docs
          pnpm run update-all-api-signatures
          if ! git diff --exit-code -- docs/; then
            echo "::error::API docs are out of date with src/types.ts. Run 'pnpm run build' (or the two generate scripts) and commit the result."
            exit 1
          fi

      - name: Build Documentation
        run: pnpm run docs:build

      - name: Verify VitePress links
        run: pnpm run docs:verify-links
