name: Node.js Package Publish

on:
  push:
    branches:
      - main

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if version changed
        id: check_version
        run: |
          PACKAGE_NAME=@rickcedwhat/playwright-smart-table
          LATEST_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}

          IS_GREATER=$(node -e "
            const [a, b] = ['$LOCAL_VERSION', '$LATEST_VERSION'].map(v => v.split('.').map(Number));
            const gt = a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]) || (a[0] === b[0] && a[1] === b[1] && a[2] > b[2]);
            process.stdout.write(gt ? 'true' : 'false');
          ")

          if [ "$IS_GREATER" = "true" ]; then
            echo "✨ Version change detected! Will publish $LOCAL_VERSION as latest."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            NEXT_VERSION="${LOCAL_VERSION}-next.${SHORT_SHA}"
            echo "📦 No version bump — will publish $NEXT_VERSION as next."
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
            echo "tag=next" >> $GITHUB_OUTPUT
          fi

      - name: Build Project
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm exec vitest run --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Test Packaging
        run: |
          chmod +x scripts/test-packaging.sh
          ./scripts/test-packaging.sh

      - name: Stamp prerelease version
        if: steps.check_version.outputs.changed == 'false'
        run: npm version ${{ steps.check_version.outputs.version }} --no-git-tag-version

      - name: Publish to NPM
        run: |
          VERSION=${{ steps.check_version.outputs.version }}
          TAG=${{ steps.check_version.outputs.tag }}
          PACKAGE_NAME=@rickcedwhat/playwright-smart-table

          if npm view "${PACKAGE_NAME}@${VERSION}" version &>/dev/null; then
            echo "⏩ ${VERSION} already published — ensuring dist-tag ${TAG} is set."
            npm dist-tag add "${PACKAGE_NAME}@${VERSION}" "$TAG"
          else
            npm publish --provenance --access public --tag "$TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare changelog for GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        id: get_changelog
        run: |
          version=${{ steps.check_version.outputs.version }}
          # Try robust Node-based extraction first
          body=$(node ./scripts/extract-changelog.mjs "$version" 2>/dev/null || echo "")
          # Fallback: default release body if extraction failed or returned empty
          if [ -z "$body" ]; then
            body="Release $version"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
          body: ${{ steps.get_changelog.outputs.body }}
          draft: false
          prerelease: false

      - name: Collect Library Metrics
        if: steps.check_version.outputs.changed == 'true' && success()
        run: node scripts/collect-metrics.mjs

      - name: Upload Metrics Artifact
        if: steps.check_version.outputs.changed == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-v${{ steps.check_version.outputs.version }}
          path: metrics/history.json
