# Dependabot PRs: enable auto-merge (squash) for non-major bumps.
# CODEOWNERS / review bypass: ruleset Dependabot bypass — see .github/DEPENDABOT.md
name: "Auto-merge Dependabot non-major updates"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check for major version bumps
        id: check-major
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pr.data.body || '';
            // Scoped to Dependabot's own summary lines so changelog text (full of unrelated
            // version numbers) is ignored. Handles semver (1.2.3) and major-only (5) tags.
            // Grouped PRs: one "Updates `pkg` from X to Y" line per package.
            // Single PRs: the body starts with "Bumps [pkg](url) from X to Y." — anchored to the
            // start because quoted upstream changelogs often contain "Bumps [...]" lines.
            const matches = [...body.matchAll(/Updates\s+`[^`]+`\s+from\s+(\d+)(?:\.\d+)*\s+to\s+(\d+)(?:\.\d+)*/ig)];
            const single = body.match(/^\s*Bumps\s+(?:\[[^\]]+\]\([^)]*\)|`[^`]+`)\s+from\s+(\d+)(?:\.\d+)*\s+to\s+(\d+)(?:\.\d+)*/i);
            if (single) matches.push(single);
            for (const m of matches) {
              if (parseInt(m[2], 10) > parseInt(m[1], 10)) {
                core.setFailed(`Contains a major version bump: ${m[0]}`);
              }
            }
            if (matches.length === 0) {
              core.setFailed('No version bump patterns found in PR body — Dependabot format may have changed');
            }

      - name: Enable auto-merge for Dependabot PR (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        if: steps.check-major.conclusion == 'success'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
